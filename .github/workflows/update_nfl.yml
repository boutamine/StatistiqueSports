name: Mise à jour quotidienne NFL JSON

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécuter le script Python
        run: python update_nfl.py

      - name: Commit et push du fichier JSON mis à jour
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add nfl_teams.json
          git commit -m "Mise à jour automatique des données NFL" || echo "Pas de changement"
          git push
