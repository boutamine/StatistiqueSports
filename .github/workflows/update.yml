name: Mise à jour quotidienne NBA JSON

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances (nba_api)
        run: pip install nba_api

      - name: Exécuter le script Python
        run: python update_nba.py

      - name: Commit et push du fichier JSON mis à jour
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add nba_teams.json
          git commit -m "Mise à jour automatique des données NBA" || echo "Pas de changement"
          git push
